name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test docker compose
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Prepare config
        # Rebuild the worker image instead of using getindico/indico:latest
        run: |
          cd indico-prod
          pip install yq
          ~/.local/bin/yq '. | .services["indico-web"].build = "./worker"' docker-compose.yml > docker-compose.local.yml

      - name: Build containers
        run: |
          cd indico-prod
          docker compose -f docker-compose.local.yml build

      - name: Check LDAP support
        run: |
          cd indico-prod
          docker compose -f docker-compose.local.yml run --rm --no-deps \
            --entrypoint /opt/indico/.venv/bin/python indico-web -c \
            'import ldap; from flask_multipass.providers.ldap import LDAPAuthProvider, LDAPIdentityProvider'

      - name: Test if Indico works
        run: ./test.sh
